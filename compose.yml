name: ${COMPOSE_PROJECT_NAME:-ynov-b3-formaflow-data}

services:
  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-formaflow}
      POSTGRES_USER: ${POSTGRES_USER:-formaflow}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-formaflow} -d ${POSTGRES_DB:-formaflow}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mongodb:
    image: mongo:8.0.29-noble
    profiles: [mongodb]
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
      - ./nosql/mongodb:/workspace/nosql/mongodb:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 3s
      timeout: 5s
      retries: 40

  redis:
    image: redis:7.4.11-bookworm
    profiles: [redis]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./nosql/redis:/workspace/nosql/redis:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  cassandra:
    image: cassandra:5.0.9-bookworm
    profiles: [cassandra]
    environment:
      CASSANDRA_CLUSTER_NAME: FormaFlowLab
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 200M
    ports:
      - "127.0.0.1:${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./nosql/cassandra:/workspace/nosql/cassandra:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE CLUSTER' 127.0.0.1 9042"]
      interval: 10s
      timeout: 10s
      retries: 40

  neo4j:
    image: neo4j:5.26.30-community
    profiles: [neo4j]
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - ./nosql/neo4j:/workspace/nosql/neo4j:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-ynov-b3-formaflow-data}_postgres-data
  mongodb-data:
    name: ${COMPOSE_PROJECT_NAME:-ynov-b3-formaflow-data}_mongodb-data
  cassandra-data:
    name: ${COMPOSE_PROJECT_NAME:-ynov-b3-formaflow-data}_cassandra-data
  neo4j-data:
    name: ${COMPOSE_PROJECT_NAME:-ynov-b3-formaflow-data}_neo4j-data
