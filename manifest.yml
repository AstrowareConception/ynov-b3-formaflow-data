repository:
  name: ynov-b3-formaflow-data
  version: 1.0.0
  status: checkpoint-nosql
  academic_year: 2026-2027
  module: Conception et architecture des données
  duration_hours: 14
  ffp_hours: 7
  tdp_hours: 7

sessions:
  - id: session-01
    duration_minutes: 240
    ffp_minutes: 135
    tdp_minutes: 105
  - id: session-02
    duration_minutes: 180
    ffp_minutes: 90
    tdp_minutes: 90
  - id: session-03
    duration_minutes: 240
    ffp_minutes: 135
    tdp_minutes: 105
  - id: session-04
    duration_minutes: 180
    ffp_minutes: 60
    tdp_minutes: 120

reference:
  source_repository: ynov-b3-formaflow-reference
  source_version: 1.0.0
  source_tag: reference-v1.0.0
  local_path: inputs/formaflow-reference
  mode: copied_snapshot

runtime:
  relational_target: PostgreSQL
  orchestration: Docker Compose
  nosql_profiles:
    - mongodb
    - redis
    - cassandra
    - neo4j
  external_services_required: false
  data_policy: synthetic_only

commands:
  - setup
  - start
  - stop
  - reset-data
  - seed
  - smoke
  - test
  - benchmark
  - nosql
  - quality
  - package
  - clean

tags:
  formative:
    - course-start
    - checkpoint-relational
    - checkpoint-nosql
  canonical:
    - reference-final
    - data-v1.0.0

assessment:
  repository_submission: false
  formative_productions: true
  summative_mode: individual_contextualized_qcm
  duration_minutes: 45
  weight_percent: 100
  scheduled_session: session-04
  included_in_tdp: true

handoff:
  target_repository: ynov-b3-formaflow-hexagonal
  local_path: handoff/data-reference
  consumer_path: inputs/data-reference
